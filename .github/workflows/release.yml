name: Release

# On every push to main that carries changesets:
#   - every package is published as a snapshot to the `next` tag on npm;
#   - the "Version Packages" pull request is opened or updated. Merging it publishes to `latest`.
# Publishes with npm Trusted Publishing: npm accepts this workflow's GitHub identity (OIDC), so there is
# no npm token to store, expire or pass two-factor checks. Every package names this repository and
# release.yml as its trusted publisher on npmjs.com (package Settings → Trusted Publisher).

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:pack

      # Runs before the changesets action, which consumes the changesets on its release branch.
      - name: Publish a snapshot to next
        run: |
          if ! ls .changeset/*.md | grep -qv README.md; then
            echo "No changesets, nothing to publish to next."
            exit 0
          fi
          pnpm changeset version --snapshot next
          pnpm changeset publish --tag next --no-git-tag
          # Put the versions and changelogs back for the next step.
          git checkout -- .
          git clean -fdq -- packages .changeset

      - name: Open or update the Version Packages pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: Version Packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With no changesets left, main holds the versions of a merged Version Packages pull request:
      # publish the ones npm does not have yet to `latest`, and push their git tags.
      - name: Publish to latest
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm changeset publish | tee publish.log
          git push origin --tags

      # A release of Mushin.js (the CLI carries its version) gets a GitHub Release whose notes collect that version's
      # changes from every changelog; the dashboard's update banner shows them. Nothing published, no release.
      - name: Create the GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if ! grep -q "New tag:.*@mushinjs/cli@$VERSION" publish.log; then
            echo "Mushin.js $VERSION was not published now, no release."
            exit 0
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          pnpm exec tsx scripts/release-notes.ts "$VERSION" > release-notes.md
          gh release create "v$VERSION" --title "Mushin.js $VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
