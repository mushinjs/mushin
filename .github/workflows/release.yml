name: Release

# On every push to main that carries changesets:
#   - every package is published as a snapshot to the `next` tag on npm;
#   - the "Version Packages" pull request is opened or updated. Merging it publishes to `latest`.
# Needs the NPM_TOKEN secret: an npm automation token that can publish the @mushin scope.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:pack

      # Runs before the changesets action, which consumes the changesets on its release branch.
      - name: Publish a snapshot to next
        run: |
          if ! ls .changeset/*.md | grep -qv README.md; then
            echo "No changesets, nothing to publish to next."
            exit 0
          fi
          pnpm changeset version --snapshot next
          pnpm changeset publish --tag next --no-git-tag
          # Put the versions and changelogs back for the next step.
          git checkout -- .
          git clean -fdq -- packages .changeset
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Version pull request, or publish to latest
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: Version Packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
