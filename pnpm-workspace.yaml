packages:
  - packages/*

allowBuilds:
  esbuild: true
  vue-demi: true
  # ssh2 falls back to pure JavaScript without its optional native bindings.
  cpu-features: false
  ssh2: false

catalog:
  # Cordis 4 is a release candidate; pin exact versions until it is stable.
  cordis: 4.0.0-rc.11
  '@cordisjs/plugin-server': 1.7.0
  zod: ^4.6.7
  openai: ^7.34.0
  '@anthropic-ai/sdk': ^0.134.0
  ws: ^8.22.0
  ssh2: ^1.17.0
  # minato and its drivers follow Cordis release candidates; upgrade them together with cordis.
  minato: 4.0.1
  '@minatojs/driver-sqlite': 5.0.3
  '@minatojs/driver-memory': 4.0.0
  tsx: ^4.23.15
  typescript: 6.0.3
  vitest: ^5.0.4
  '@types/node': ^24.0.0
  '@types/ws': ^8.18.2
  '@types/ssh2': ^1.15.5
  vue: ^3.5.44
  vite: ^8.3.4
  '@vitejs/plugin-vue': ^6.0.10
  vue-tsc: ^3.3.13
  naive-ui: ^2.45.3
  pinia: ^4.1.0
  vue-router: ^5.4.0
  vue-i18n: ^11.4.14
  '@vicons/ionicons5': ^0.13.0
  '@vue-flow/core': ^1.48.2
  '@vue-flow/background': ^1.3.2
  '@vue-flow/controls': ^1.1.3
  '@vue-flow/minimap': ^1.5.4
  echarts: ^5.6.0
  markdown-it: ^15.0.2
  '@types/markdown-it': ^14.2.0
  highlight.js: ^11.12.0
  mermaid: ^12.1.0

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.134.0'
  - openai@7.34.0
